name: CD Production Deployment

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git Commit SHA or branch to deploy (default: current HEAD)"
        required: false
        default: ""

concurrency:
  group: job-search-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Production Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Compute image tags
        id: meta
        run: |
          SHA="${{ inputs.git_ref || github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${REPO_LOWER}:${SHA}"
          LATEST_TAG="ghcr.io/${REPO_LOWER}:latest"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.latest_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cd-docker
          cache-to: type=gha,scope=cd-docker,mode=max
          provenance: false
          sbom: false

  deploy-production:
    name: Deploy Web to Production VM
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute Controlled Production VM Cutover
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -Eeuo pipefail

            IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            SHORT_SHA="${{ needs.build-and-push.outputs.short_sha }}"
            DEPLOY_PATH="/opt/job-search"

            echo "=================================================================="
            echo "INITIATING CONTROLLED PRODUCTION DEPLOYMENT"
            echo "Target Image: $IMAGE_TAG"
            echo "Commit SHA: $SHORT_SHA"
            echo "=================================================================="

            cd "$DEPLOY_PATH"

            # 1. Pre-deploy verification
            echo "--> [1/9] Pre-deploy System & Workload Verification..."
            AVAIL_GB=$(df -B1G / | awk 'NR==2 {print $4}')
            if [ "$AVAIL_GB" -lt 5 ]; then
                echo "ERROR: Insufficient disk space ($AVAIL_GB GB available, minimum 5 GB required)."
                exit 1
            fi

            # Record current jobs count baseline before deploy
            PREDEPLOY_JOBS=$(docker exec job-search-web openings healthcheck 2>/dev/null | grep -o '"jobs_count":[0-9]*' | cut -d: -f2 || echo "0")
            echo "--> Pre-deploy Jobs Count Baseline: $PREDEPLOY_JOBS"

            # 2. Mandatory Pre-deploy Database Backup
            echo "--> [2/9] Mandatory Pre-deploy Database Snapshot..."
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            BACKUP_FILE="${DEPLOY_PATH}/backups/job-search-predeploy-${TIMESTAMP}-${SHORT_SHA}.tar.gz"

            docker run --rm \
              -v job-search-data:/data:ro \
              -v "${DEPLOY_PATH}/backups":/backup \
              alpine tar -czf "/backup/job-search-predeploy-${TIMESTAMP}-${SHORT_SHA}.tar.gz" -C /data .

            sha256sum "$BACKUP_FILE" > "${BACKUP_FILE}.sha256"
            if ! sha256sum -c "${BACKUP_FILE}.sha256"; then
                echo "CRITICAL ERROR: Pre-deploy backup checksum verification FAILED. Aborting deployment."
                exit 1
            fi
            echo "--> Pre-deploy backup verified: $BACKUP_FILE"

            # 3. Pull immutable container image
            echo "--> [3/9] Pulling immutable Docker image..."
            docker pull "$IMAGE_TAG"

            # 4. Save release metadata
            echo "--> [4/9] Writing release metadata..."
            mkdir -p "${DEPLOY_PATH}/releases/${SHORT_SHA}"
            cat <<EOF > "${DEPLOY_PATH}/releases/${SHORT_SHA}/release.json"
            {
              "commit_sha": "${SHORT_SHA}",
              "image": "${IMAGE_TAG}",
              "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "predeploy_jobs_count": ${PREDEPLOY_JOBS},
              "backup_path": "${BACKUP_FILE}"
            }
            EOF

            # 5. Update Compose image & recreate WEB ONLY
            echo "--> [5/9] Updating Compose file and recreating WEB container..."
            PREV_IMAGE=$(grep 'image:' docker-compose.production.yml | head -n 1 | awk '{print $2}')

            sed -i "s|image: .*|image: ${IMAGE_TAG}|g" docker-compose.production.yml

            if ! docker compose -f docker-compose.production.yml up -d web; then
                echo "ERROR: Container recreation failed. Executing automatic rollback..."
                sed -i "s|image: .*|image: ${PREV_IMAGE}|g" docker-compose.production.yml
                docker compose -f docker-compose.production.yml up -d web
                exit 1
            fi

            # 6. Bounded Health Check Wait Loop
            echo "--> [6/9] Waiting for container health check (max 120s)..."
            HEALTHY=0
            for i in {1..24}; do
                STATUS=$(docker inspect job-search-web --format '{{.State.Health.Status}}' 2>/dev/null || echo "unhealthy")
                if [ "$STATUS" = "healthy" ]; then
                    HEALTHY=1
                    break
                fi
                echo "--> Waiting for healthcheck... ($i/24, current: $STATUS)"
                sleep 5
            done

            if [ "$HEALTHY" -ne 1 ]; then
                echo "CRITICAL ERROR: Healthcheck timed out. Executing automatic rollback..."
                sed -i "s|image: .*|image: ${PREV_IMAGE}|g" docker-compose.production.yml
                docker compose -f docker-compose.production.yml up -d web
                exit 1
            fi
            echo "--> Web container is HEALTHY."

            # 7. Database Integrity & Count Invariant Check
            echo "--> [7/9] Verifying database integrity and row count invariants..."
            INTEGRITY=$(docker exec job-search-web python3 -c "import sqlite3; conn = sqlite3.connect('/data/db/openings.db'); print(conn.cursor().execute('PRAGMA integrity_check;').fetchone()[0])" 2>/dev/null || echo "failed")
            if [ "$INTEGRITY" != "ok" ]; then
                echo "CRITICAL ERROR: SQLite integrity check FAILED: $INTEGRITY. Executing automatic rollback..."
                sed -i "s|image: .*|image: ${PREV_IMAGE}|g" docker-compose.production.yml
                docker compose -f docker-compose.production.yml up -d web
                exit 1
            fi

            POSTDEPLOY_JOBS=$(docker exec job-search-web openings healthcheck | grep -o '"jobs_count":[0-9]*' | cut -d: -f2)
            echo "--> Post-deploy Jobs Count: $POSTDEPLOY_JOBS (Pre-deploy: $PREDEPLOY_JOBS)"
            if [ "$POSTDEPLOY_JOBS" -lt "$PREDEPLOY_JOBS" ]; then
                echo "CRITICAL ERROR: Data loss detected ($POSTDEPLOY_JOBS < $PREDEPLOY_JOBS). Executing automatic rollback..."
                sed -i "s|image: .*|image: ${PREV_IMAGE}|g" docker-compose.production.yml
                docker compose -f docker-compose.production.yml up -d web
                exit 1
            fi

            # 8. Post-deployment Smoke Tests
            echo "--> [8/9] Executing Post-deployment Smoke Tests..."
            curl -fsS http://127.0.0.1:8501/health > /dev/null
            curl -fsS https://jobs.avaliasolar.com.br/health > /dev/null

            # 9. Verify Scheduler is STOPPED & Port 8501 is Private
            echo "--> [9/9] Verifying Scheduler and Port Isolation..."
            if docker ps --filter name=job-search-scheduler | grep -q "job-search-scheduler"; then
                echo "ERROR: Scheduler is running unexpectedly!"
                exit 1
            fi

            BIND_CHECK=$(ss -lntp | grep ':8501' | awk '{print $4}')
            echo "--> Port 8501 Bind: $BIND_CHECK"

            echo "=================================================================="
            echo "PRODUCTION DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "Image: $IMAGE_TAG"
            echo "Web Status: HEALTHY"
            echo "Scheduler: STOPPED"
            echo "Public URL: https://jobs.avaliasolar.com.br"
            echo "=================================================================="
