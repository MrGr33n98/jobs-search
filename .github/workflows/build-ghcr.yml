name: Build GHCR Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Production Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.production
          push: true
          tags: |
            ghcr.io/mrgr33n98/jobs-search:${{ github.sha }}
            ghcr.io/mrgr33n98/jobs-search:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cd-docker
          cache-to: type=gha,scope=cd-docker,mode=max
          provenance: false
          sbom: false
